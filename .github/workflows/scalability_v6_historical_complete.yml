name: scalability-v6-historical-complete

# COMPLETE_SET second pass of the frozen historical conflict-tier recompute
# (archived-AMB rows of protocol/v6_historical_recompute_tasks.json).
#
# This is an ADD-ON audit of the archived 36,450-evaluation rmt_fms baseline.
# It is disjoint from the formal 8,280-cell v6 matrix: separate workflow,
# separate artifacts, no shared budget and no pooled results.
#
# The primary verdict pass (3,645/3,645, 0 drift) was executed on the audit
# host and its compact summary is committed as
# work/v6_historical_recompute/summary/primary_pass_summary.json so that the
# aggregate job can emit one complete summary.

on:
  workflow_dispatch:
    inputs:
      num_shards:
        description: "Number of COMPLETE_SET shards (deterministic task_id % N)"
        required: false
        default: "20"
      workers_per_shard:
        description: "Process pool workers inside one shard job (<= 8)"
        required: false
        default: "2"
      wall_cap:
        description: "Per-task wall-clock cap in seconds"
        required: false
        default: "60"

permissions:
  contents: read
  actions: read

concurrency:
  group: v6-historical-complete-${{ github.ref }}
  cancel-in-progress: false

env:
  FROZEN_MANIFEST_SHA256: e1f6b455285e45cadbec655749b92db3c53b3fdf551dabbd3d7722804bc47a8f
  PYTHONHASHSEED: "0"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
  NUMEXPR_NUM_THREADS: "1"
  VECLIB_MAXIMUM_THREADS: "1"

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-v5.lock
      - run: python -m pip install --require-hashes -r requirements-v5.lock
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate the frozen recompute manifest
        run: >-
          python scripts/recompute_v6_historical_impact.py verify-manifest
          --manifest protocol/v6_historical_recompute_tasks.json
          --expect-sha "$FROZEN_MANIFEST_SHA256"
          --out results/v6_historical_complete_manifest_validation.json
      - name: Confirm the committed primary-pass summary
        run: |
          python - <<'PY'
          import json
          path = "work/v6_historical_recompute/summary/primary_pass_summary.json"
          data = json.load(open(path))
          rows = data["rows"]
          assert len(rows) == 3645, len(rows)
          assert data["coverage"]["recorded"] == 3645, data["coverage"]
          assert sum(1 for row in rows if row["archived_verdict"] == "VER") == 1689
          assert sum(1 for row in rows if row["archived_verdict"] == "AMB") == 1956
          print("primary-pass summary OK: 3645 rows (VER 1689 / AMB 1956)")
          PY
      - id: matrix
        env:
          NUM_SHARDS: ${{ inputs.num_shards }}
        run: |
          MATRIX=$(python -c 'import json, os; n = int(os.environ["NUM_SHARDS"]); print(json.dumps(list(range(n))))')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v6-hist-complete-validation-${{ github.run_id }}
          path: results/v6_historical_complete_manifest_validation.json
          if-no-files-found: error
          retention-days: 30

  run:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.validate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-v5.lock
      - run: python -m pip install --require-hashes -r requirements-v5.lock
      - name: Execute frozen COMPLETE_SET shard
        env:
          SHARD: ${{ matrix.shard }}
          NUM_SHARDS: ${{ inputs.num_shards }}
          WORKERS: ${{ inputs.workers_per_shard }}
          WALL_CAP: ${{ inputs.wall_cap }}
        run: |
          python scripts/recompute_v6_historical_impact.py run \
            --phase complete \
            --shard "$SHARD" \
            --num-shards "$NUM_SHARDS" \
            --out results/hist \
            --workers "$WORKERS" \
            --wall-cap "$WALL_CAP" \
            --no-resume
      - name: Show shard result
        if: always()
        run: |
          ls -R results/hist 2>/dev/null | head -50 || true
          cat "results/hist/run_shard_${{ matrix.shard }}.json" 2>/dev/null || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v6-hist-complete-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: results/hist
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: run
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-v5.lock
      - run: python -m pip install --require-hashes -r requirements-v5.lock
      - uses: actions/download-artifact@v4
        with:
          pattern: v6-hist-complete-shard-*
          path: artifacts
          merge-multiple: true
      - name: Aggregate the COMPLETE_SET shards
        env:
          NUM_SHARDS: ${{ inputs.num_shards }}
        run: |
          ls -R artifacts | head -80
          python scripts/recompute_v6_historical_impact.py aggregate \
            --shards-dir artifacts \
            --out results/hist_aggregate \
            --num-shards "$NUM_SHARDS" \
            --primary-summary work/v6_historical_recompute/summary/primary_pass_summary.json
      - name: Show aggregate status
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          path = pathlib.Path("results/hist_aggregate/summary/summary.json")
          if not path.is_file():
              raise SystemExit("aggregate summary missing")
          summary = json.load(open(path))
          coverage = summary["coverage"]["complete_pass_amb_subset"]
          print(json.dumps({"snapshot_status": summary["snapshot_status"],
                            "complete_pass": coverage,
                            "critical_pairs": {
                                key: summary["critical_pairs"].get(key)
                                for key in ("rows", "equal", "increased", "decreased")}},
                           indent=2))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v6-hist-complete-aggregate-${{ github.run_id }}
          path: results/hist_aggregate
          if-no-files-found: warn
          retention-days: 30
