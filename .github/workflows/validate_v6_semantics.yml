name: Validate v6 strong-time semantics

on:
  workflow_dispatch:
  push:
    branches: [scalability-v6-semantics-corrected]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/validate_v6_model_semantics.py"
      - "scripts/write_v6_semantics_gate.py"
      - "requirements-v5.lock"
      - ".github/workflows/validate_v6_semantics.yml"

permissions:
  contents: read

concurrency:
  group: v6-semantics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-v5.lock
      - name: Install frozen dependencies
        run: python -m pip install --require-hashes -r requirements-v5.lock
      - name: Run complete regression suite
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Validate all family semantics
        run: python scripts/validate_v6_model_semantics.py --out semantics-results --seed 0
      - name: Freeze semantics gate evidence
        run: >-
          python scripts/write_v6_semantics_gate.py
          --family-results semantics-results/generator_regression_results.json
          --out semantics-results/semantics_validation.json
      - name: Record environment
        run: |
          python -VV > semantics-results/python-version.txt
          python -m pip freeze --all > semantics-results/pip-freeze.txt
          uname -a > semantics-results/runner-uname.txt
      - name: Upload semantics evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v6-semantics-${{ github.run_id }}
          path: semantics-results
          if-no-files-found: error
          retention-days: 30
