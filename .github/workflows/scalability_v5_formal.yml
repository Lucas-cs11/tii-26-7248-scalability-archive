name: scalability-v5-formal
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements-v5.lock
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/validate_v5_models.py --seeds 0,1,2 --out results/semantic_validation.json
      - run: |
          python scripts/build_v5_formal.py
          git diff --exit-code -- protocol/v5_formal_manifest.json protocol/v5_formal_tasks
      - run: |
          python scripts/validate_v5_formal_protocol.py \
            --manifest protocol/v5_formal_manifest.json \
            --tasks protocol/v5_formal_tasks \
            --out results/formal_protocol_validation.json
      - id: matrix
        run: |
          MATRIX=$(python -c 'import json; d=json.load(open("protocol/v5_formal_manifest.json")); print(json.dumps(list(range(d["shards"]))))')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v5-formal-semantic-${{ github.run_id }}
          path: |
            results/semantic_validation.json
            results/formal_protocol_validation.json
          if-no-files-found: error
          retention-days: 30
  run:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        shard: ${{ fromJSON(needs.validate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install --require-hashes -r requirements-v5.lock
      - name: Resolve numeric GitHub job ID
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
        run: |
          JOB_DATABASE_ID=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | select(.name == "run ('"${SHARD}"')") | .id' | head -n 1)
          [[ "$JOB_DATABASE_ID" =~ ^[0-9]+$ ]]
          echo "ACTIONS_JOB_DATABASE_ID=$JOB_DATABASE_ID" >> "$GITHUB_ENV"
      - env:
          TASKS_DIR: protocol/v5_formal_tasks
          ARTIFACT_NAME: v5-formal-${{ matrix.shard }}-${{ github.run_id }}
          EXECUTED_SOURCE_SHA: ${{ github.sha }}
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONHASHSEED: "0"
        run: python runner/run_shard.py "${{ matrix.shard }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v5-formal-${{ matrix.shard }}-${{ github.run_id }}
          path: results/
          if-no-files-found: error
          retention-days: 30
