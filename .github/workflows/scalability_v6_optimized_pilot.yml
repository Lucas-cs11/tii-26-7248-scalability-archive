name: scalability-v6-optimized-pilot

on:
  workflow_dispatch:
  push:
    branches:
      - scalability-v6-synchronizer-optimization
      - scalability-v6-instrumented-baseline
    paths:
      - ".github/workflows/scalability_v6_optimized_pilot.yml"
      - "protocol/v6_pilot_manifest.json"
      - "protocol/v6_pilot_tasks/**"
      - "protocol/v6_semantics_gate.json"
      - "src/**"
      - "runner/**"

permissions:
  contents: read
  actions: read

concurrency:
  group: v6-optimized-pilot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-v5.lock
      - run: python -m pip install --require-hashes -r requirements-v5.lock
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Rebuild frozen Pilot protocol and confirm it is unchanged
        run: |
          python scripts/build_v6_pilot.py
          git diff --exit-code -- protocol/v6_pilot_manifest.json protocol/v6_pilot_tasks
      - name: Validate frozen Pilot protocol
        run: >-
          python scripts/validate_v6_pilot_protocol.py
          --manifest protocol/v6_pilot_manifest.json
          --tasks protocol/v6_pilot_tasks
          --semantics-gate protocol/v6_semantics_gate.json
          --out results/v6_pilot_protocol_validation.json
      - name: Validate the 12 model families against the timed semantics
        run: >-
          python scripts/validate_v6_model_semantics.py
          --out results/v6_model_semantics_validation.json
      - id: matrix
        run: |
          MATRIX=$(python -c 'import json; d=json.load(open("protocol/v6_pilot_manifest.json")); print(json.dumps(list(range(d["shards"]))))')
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v6-opt-pilot-validation-${{ github.run_id }}
          path: |
            results/v6_pilot_protocol_validation.json
            results/v6_model_semantics_validation.json
          if-no-files-found: error
          retention-days: 30

  run:
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        shard: ${{ fromJSON(needs.validate.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-v5.lock
      - run: python -m pip install --require-hashes -r requirements-v5.lock
      - name: Resolve numeric GitHub job ID
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
        run: |
          JOB_DATABASE_ID=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | select(.name == "run ('"${SHARD}"')") | .id' | head -n 1)
          [[ "$JOB_DATABASE_ID" =~ ^[0-9]+$ ]]
          echo "ACTIONS_JOB_DATABASE_ID=$JOB_DATABASE_ID" >> "$GITHUB_ENV"
      - name: Execute frozen Pilot shard
        env:
          TASKS_DIR: protocol/v6_pilot_tasks
          ARTIFACT_NAME: v6-opt-pilot-${{ matrix.shard }}-${{ github.run_id }}
          EXECUTED_SOURCE_SHA: ${{ github.sha }}
          V6_PROFILE: "1"
          SCG_CACHE_DIR: ${{ runner.temp }}/scg_cache
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
          PYTHONHASHSEED: "0"
        run: python runner/run_shard.py "${{ matrix.shard }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v6-opt-pilot-${{ matrix.shard }}-${{ github.run_id }}
          path: results/
          if-no-files-found: error
          retention-days: 30
