name: scalability-v6-formal-audit

# Runs the independent audit, the statistics and Figure 6 for a completed Modal
# formal matrix.  The raw Modal records are published as a GitHub *release
# asset* (never committed), and this workflow downloads that asset, audits it
# and produces the figures — all computation happens on GitHub-hosted runners.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub release tag holding the raw Modal results zip"
        required: true
      run_id:
        description: "Modal run id recorded in the raw records"
        required: true
      source_sha:
        description: "Verifier source SHA recorded in the raw records"
        required: true
      image_spec_sha256:
        description: "Modal image spec SHA-256 recorded in the raw records"
        required: true
      expected_tasks:
        description: "Expected number of unique tasks"
        required: false
        default: "8280"

permissions:
  contents: read
  actions: read

concurrency:
  group: v6-formal-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-v5.lock
      - run: python -m pip install --require-hashes -r requirements-v5.lock
      - run: python -m pip install matplotlib==3.11.2
      - name: Download raw Modal records from the release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/v6_raw work/v6_formal_run_${{ inputs.run_id }}
          gh release download "${{ inputs.release_tag }}" \
            --pattern "*.zip" --dir /tmp/v6_raw
          unzip -q /tmp/v6_raw/*.zip -d work/v6_formal_run_${{ inputs.run_id }}
          echo "raw records: $(find work/v6_formal_run_${{ inputs.run_id }}/raw -name '*.json' | wc -l)"
      - name: Independent audit
        run: >-
          python scripts/audit_v6_modal_results.py
          --download-dir work/v6_formal_run_${{ inputs.run_id }}
          --shard-manifest protocol/v6_modal_shards_manifest.json
          --source-tasks protocol/v6_formal_tasks
          --run-manifest work/v6_formal_run_${{ inputs.run_id }}/run_manifest.json
          --out work/v6_formal_audit
          --expected-source-sha "${{ inputs.source_sha }}"
          --expected-image-spec-sha256 "${{ inputs.image_spec_sha256 }}"
          --expected-tasks "${{ inputs.expected_tasks }}"
      - name: Statistics
        run: >-
          python scripts/analyze_v6_formal_results.py
          --tasks-dir protocol/v6_formal_tasks
          --manifest protocol/v6_formal_manifest.json
          --raw-dir work/v6_formal_run_${{ inputs.run_id }}
          --out work/v6_analysis_formal
          --dataset-label FORMAL
          --reference-audit work/v6_formal_audit/audit.json
      - name: Figure 6
        run: >-
          python scripts/plot_figure6_v6.py
          --analysis-dir work/v6_analysis_formal
          --out work/v6_analysis_formal
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v6-formal-audit-${{ inputs.run_id }}
          path: |
            work/v6_formal_audit/
            work/v6_analysis_formal/
          if-no-files-found: error
          retention-days: 30
