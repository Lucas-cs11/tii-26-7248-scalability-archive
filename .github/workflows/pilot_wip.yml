name: pilot-wip
on: workflow_dispatch
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: |
          M=$(python3 -c 'import json;d=json.load(open("protocol/manifest_pilot.json"));print(json.dumps(list(range(d["shards"]))))')
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
  run:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install numpy==2.3.4 scipy==1.16.2
      - env:
          TASKS_DIR: protocol/pilot_tasks
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: python runner/run_shard.py "${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pilot-${{ matrix.shard }}-${{ github.run_id }}
          path: results/
